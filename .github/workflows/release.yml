name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.3'

jobs:
  # Android：universal（armeabi-v7a + arm64-v8a + x86_64）+ 按架构拆分，
  # minSdk 由 Flutter 决定（引擎支持的最低版本），尽可能覆盖老设备。
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/fund-valuation-android-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/fund-valuation-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/fund-valuation-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/fund-valuation-android-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist

  # Windows：x64 安装包（Inno Setup 生成的 setup EXE）。
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Build installer EXE (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          Write-Host "AppVersion=$ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=$ver windows\packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/packaging/dist/*.exe

  # Linux：x64 DEB 安装包（GTK3）。
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - name: Build DEB
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "Version=$VER"
          mkdir -p pkg/DEBIAN pkg/usr/local/fund_valuation pkg/usr/share/applications
          cp -r build/linux/x64/release/bundle/* pkg/usr/local/fund_valuation/
          cat > pkg/DEBIAN/control <<EOF
          Package: fund-valuation
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0
          Maintainer: whboy10000
          Description: Fund real-time valuation app
           Cross-platform fund valuation with realtime estimates and market data.
          EOF
          cat > pkg/usr/share/applications/fund-valuation.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Fund Valuation
          Exec=/usr/local/fund_valuation/funds_valuation
          Terminal=false
          Categories=Finance;
          EOF
          dpkg-deb --build --root-owner-group pkg fund-valuation-linux-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: fund-valuation-linux-x64.deb

  # macOS：Universal 二进制（Intel x86_64 + Apple Silicon arm64 单包支持）。
  macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Verify universal binary
        run: |
          BIN=build/macos/Build/Products/Release/基金估值.app/Contents/MacOS/基金估值
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q 'x86_64 arm64\|arm64 x86_64' && echo 'Universal: OK'
      - name: Pack DMG
        run: |
          hdiutil create -volname "Fund Valuation" \
            -srcfolder 'build/macos/Build/Products/Release/基金估值.app' \
            -ov -format UDZO fund-valuation-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: fund-valuation-macos-universal.dmg

  # iOS：未签名 ipa（iOS 15.0+），需自行签名后安装（Xcode/侧载工具）。
  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
      - name: Pack unsigned ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry fund-valuation-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: fund-valuation-ios-unsigned.ipa

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, linux, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
