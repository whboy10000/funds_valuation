server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter Web 单页应用：未知路径回退到入口页。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源开启强缓存（Flutter 产物文件名带版本指纹，更新时 index.html 会重新拉取）。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
